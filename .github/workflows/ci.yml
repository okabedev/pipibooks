name: CI

on:
  pull_request:
    # edited: PR 제목을 고치면 pr-title을 다시 검사한다.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [develop, main]
  # 경로와 무관하게 모든 잡을 실행한다.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.services }}
      clients: ${{ steps.filter.outputs.clients }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            services:
              - 'services/**'
              - '.github/workflows/**'
              - '.tool-versions'
            clients:
              - 'clients/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/**'
              - '.nvmrc'
              - '.tool-versions'
            infra:
              - 'infra/**'
              - '.dockerignore'
              - '.github/workflows/**'

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # squash 머지 시 PR 제목이 커밋 메시지가 되므로 커밋 규칙으로 검사한다.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            core-api
            catalog-worker
            event-collector
            libs
            web
            app
            shared
            infra
            docs
            repo
          requireScope: true
          # commitlint(subject-max-length 50)와 같은 규칙. squash 커밋에는 GitHub가 " (#N)"을 덧붙이므로
          # 커밋 제목은 최대 50+자가 되지만, 보호 브랜치의 squash 커밋은 amend·rebase하지 않으므로 commitlint 대상이 아니다.
          subjectPattern: ^(?!.*\.$).{1,50}$
          subjectPatternError: "제목은 50자 이내, 마침표 없이 작성한다: {subject}"

  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # PR 브랜치 이름을 Git Flow 규칙으로 검사한다(로컬 pre-push 훅을 건너뛴 경우의 최종 방어선).
      - run: bash scripts/check-branch-name.sh "$HEAD_REF"
        env:
          HEAD_REF: ${{ github.head_ref }}

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:scripts
      - run: pnpm check:docs
      - run: pnpm format:check

  services:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.services == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew build --console=plain
        working-directory: services

  web:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.clients == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web test
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e

  infra:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.services == 'true' || needs.changes.outputs.clients == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: bash infra/scripts/build-local.sh
      - run: bash infra/scripts/smoke-test.sh

  ci-ok:
    if: always()
    needs: [changes, pr-title, branch-name, scripts, services, web, infra]
    runs-on: ubuntu-latest
    steps:
      # 경로 필터로 건너뛴(skipped) 잡은 통과로 본다. 실패·취소만 막는다.
      - name: 결과 확인
        run: |
          echo '${{ toJSON(needs) }}'
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "실패하거나 취소된 잡이 있습니다"; exit 1
          fi
