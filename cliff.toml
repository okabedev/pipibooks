# git-cliff 설정: Conventional Commits → CHANGELOG.md
[changelog]
header = "# Changelog\n\n이 파일은 git-cliff로 생성한다. 직접 수정하지 않는다.\n\n"
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | split(pat="\n") | first | trim }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->기능" },
  { message = "^fix", group = "<!-- 1 -->수정" },
  { message = "^perf", group = "<!-- 2 -->성능" },
  { message = "^refactor", group = "<!-- 3 -->리팩터링" },
  { message = "^docs", group = "<!-- 4 -->문서" },
  { message = "^chore\\(repo\\): v[0-9]", skip = true },
  { message = ".*", group = "<!-- 9 -->기타" },
]
protect_breaking_commits = true
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
