spring:
  application:
    name: core
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    schemas: core
    default-schema: core
    create-schemas: false
    locations: classpath:db/migration/core
    fail-on-missing-locations: false
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  mvc:
    problemdetails:
      enabled: true
card:
  sync:
    enabled: true
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
logging:
  structured:
    format:
      console: ecs
