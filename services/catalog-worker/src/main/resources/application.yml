spring:
  application:
    name: catalog-worker
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    schemas: catalog
    default-schema: catalog
    create-schemas: false
    locations: classpath:db/migration/catalog
    fail-on-missing-locations: false
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    user: ${DB_USER}
    password: ${DB_PASSWORD}
nlk:
  base-url: https://www.nl.go.kr
  cert-key: ${NLK_CERT_KEY:}
  permits-per-second: 1.0
  page-size: 50
collect:
  window-days: 14
healthcheck:
  collect-url: ${HEALTHCHECK_COLLECT_URL:}
server:
  port: 8082
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
logging:
  structured:
    format:
      console: ecs
