# Cloudflare Tunnel 라우팅(스펙 §7.3). 터널 ID는 compose가 실행 인자로 넘긴다.
credentials-file: /etc/cloudflared/credentials.json

ingress:
  - hostname: pipibooks.com
    service: http://web:3000
  - hostname: api.pipibooks.com
    path: ^/v1/events
    service: http://event-collector:8081
  - hostname: api.pipibooks.com
    service: http://core-api:8080
  - service: http_status:404
