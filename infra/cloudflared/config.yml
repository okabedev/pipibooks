# Cloudflare Tunnel 라우팅(스펙 §7.3). pipibooks-cloudflared 이미지에 포함된다(infra/cloudflared/Dockerfile).
# 터널 ID는 compose가 실행 인자로, 인증 정보는 환경 변수 TUNNEL_CRED_CONTENTS로 넘긴다.

ingress:
  - hostname: pipibooks.com
    service: http://web:3000
  - hostname: api.pipibooks.com
    path: ^/v1/events
    service: http://event-collector:8081
  - hostname: api.pipibooks.com
    service: http://core:8080
  - service: http_status:404
