# 운영 구성. 기동·버전 변경은 infra/scripts/deploy.sh로만 한다(docs/ops/deploy.md).
# 변수: infra/compose/.env — PIPIBOOKS_VERSION(deploy.sh가 갱신), TUNNEL_ID
name: pipibooks

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  web:
    <<: *defaults
    image: ghcr.io/okabedev/pipibooks-web:${PIPIBOOKS_VERSION:?PIPIBOOKS_VERSION 필요}
    mem_limit: 384m
    networks: [edge]

  core:
    <<: *defaults
    image: ghcr.io/okabedev/pipibooks-core:${PIPIBOOKS_VERSION:?PIPIBOOKS_VERSION 필요}
    mem_limit: 768m
    networks: [edge, internal]

  event-collector:
    <<: *defaults
    image: ghcr.io/okabedev/pipibooks-event-collector:${PIPIBOOKS_VERSION:?PIPIBOOKS_VERSION 필요}
    mem_limit: 768m
    networks: [edge, internal]

  catalog-worker:
    <<: *defaults
    image: ghcr.io/okabedev/pipibooks-catalog-worker:${PIPIBOOKS_VERSION:?PIPIBOOKS_VERSION 필요}
    mem_limit: 768m
    networks: [internal]

  postgres:
    <<: *defaults
    image: postgres:18.6-alpine
    mem_limit: 1g
    env_file: ${POSTGRES_ENV_FILE:-../env/postgres.env}
    ports:
      # 운영은 127.0.0.1:5432. 스모크 테스트는 127.0.0.1: (임의 포트)로 바꿔 운영과 충돌하지 않게 한다.
      - "${POSTGRES_PUBLISH:-127.0.0.1:5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    <<: *defaults
    image: redis:8.10.3-alpine
    mem_limit: 256m
    command:
      ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    networks: [internal]

  cloudflared:
    <<: *defaults
    # config.yml이 들어 있는 자체 이미지. 호스트 파일을 마운트하지 않는다(재부팅 직후 기동 실패 방지).
    image: ghcr.io/okabedev/pipibooks-cloudflared:${PIPIBOOKS_VERSION:?PIPIBOOKS_VERSION 필요}
    profiles: [tunnel]
    mem_limit: 128m
    # TUNNEL_CRED_CONTENTS: 터널 인증 정보 JSON(infra/env/cloudflared.env, gitignore)
    env_file: ${CLOUDFLARED_ENV_FILE:-../env/cloudflared.env}
    command:
      [
        "tunnel",
        "--no-autoupdate",
        "--config",
        "/etc/cloudflared/config.yml",
        "run",
        "${TUNNEL_ID:?TUNNEL_ID 필요}",
      ]
    networks: [edge]

networks:
  edge:
  internal:

volumes:
  pgdata:
  redisdata:
